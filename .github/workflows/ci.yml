name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: typecheck / lint / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy

  sql:
    name: SQL tests (RPC / 制約 / RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu ランナーには PostgreSQL が同梱されている（サービスは停止状態）。initdb で一時クラスタを立てる
      - name: Locate PostgreSQL
        run: |
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "PGBIN=$PGBIN" >> "$GITHUB_ENV"
          "$PGBIN/postgres" --version
      - run: bash tests/sql/run.sh
