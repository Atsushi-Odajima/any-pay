name: Supabase deploy

# 本番 Supabase プロジェクトへマイグレーション・Auth 設定・Edge Functions を反映する。
# 必要な GitHub Secrets（Settings → Secrets and variables → Actions）:
#   SUPABASE_ACCESS_TOKEN  https://supabase.com/dashboard/account/tokens で発行
#   SUPABASE_DB_PASSWORD   プロジェクト作成時の DB パスワード（Project Settings → Database でリセット可）
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET（任意。Phase 8 を使う場合）
# Secrets が未設定のときはジョブをスキップする。

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: 'seed.sql を投入する（デモデータ。初回のみ推奨）'
        type: boolean
        default: false
      deploy_functions:
        description: 'Edge Functions（Stripe）をデプロイする'
        type: boolean
        default: false

env:
  SUPABASE_PROJECT_ID: tyrddhwgiasurpchpkhn

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD が未設定のためスキップします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        if: steps.secrets.outputs.ok == 'true'
        run: supabase db push

      - name: Seed demo data（workflow_dispatch で seed=true のとき）
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.seed
        run: supabase db push --include-seed

      # Auth 設定（Site URL・Phone 有効化・Test OTP。config.toml に書いた項目だけ）をリモートへ反映
      - name: Show auth config diff
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: supabase config diff
      - name: Push auth config (Test OTP)
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: supabase config push --yes

      - name: Deploy Edge Functions (Stripe)
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.deploy_functions
        run: |
          supabase functions deploy stripe-checkout
          supabase functions deploy stripe-webhook --no-verify-jwt
          if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            supabase secrets set STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          fi

      # 生成した型を手書きの src/types/database.ts と突き合わせ、差分を artifact として残す
      - name: Generate types and diff
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: |
          supabase gen types typescript --linked --schema public > /tmp/database.generated.ts
          npx --yes prettier --parser typescript /tmp/database.generated.ts > /tmp/database.generated.pretty.ts || cp /tmp/database.generated.ts /tmp/database.generated.pretty.ts
          diff -u src/types/database.ts /tmp/database.generated.pretty.ts > /tmp/database.types.diff || true
          echo "型の差分行数: $(wc -l < /tmp/database.types.diff)"
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: database-types
          path: |
            /tmp/database.generated.ts
            /tmp/database.types.diff
          if-no-files-found: ignore
