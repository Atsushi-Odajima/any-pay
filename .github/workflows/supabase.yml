name: Supabase deploy

# 本番 Supabase プロジェクトへマイグレーション・Auth 設定・Edge Functions を反映する。
# 必要な GitHub Secrets（Settings → Secrets and variables → Actions）:
#   SUPABASE_ACCESS_TOKEN  https://supabase.com/dashboard/account/tokens で発行
#   SUPABASE_DB_PASSWORD   プロジェクト作成時の DB パスワード（Project Settings → Database でリセット可）
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET（任意。Stripe テスト決済でチャージする場合）
#   SANDBOX_API_KEY / SANDBOX_WEBHOOK_SECRET（任意。未設定なら初回に自動生成して登録する）
# Variables（任意）: APP_ORIGIN（フロントの URL。既定 https://any-pay.pages.dev）
# Secrets が未設定のときはジョブをスキップする。Edge Functions は毎回デプロイする。

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: 'seed.sql を投入する（デモデータ。初回のみ推奨）'
        type: boolean
        default: false
      commit_types:
        description: '生成した型（supabase gen types）を src/types/database.ts にコミットする'
        type: boolean
        default: false

env:
  SUPABASE_PROJECT_ID: tyrddhwgiasurpchpkhn

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD が未設定のためスキップします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        if: steps.secrets.outputs.ok == 'true'
        run: supabase db push

      - name: Seed demo data（workflow_dispatch で seed=true のとき）
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.seed
        run: supabase db push --include-seed

      # Auth 設定（Site URL・Phone 有効化・Test OTP。config.toml に書いた項目だけ）をリモートへ反映
      - name: Show auth config diff
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: supabase config diff
      - name: Push auth config (Test OTP)
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: supabase config push --yes

      # チャージ API（charge-*）とサンドボックス（sandbox-gateway）、Stripe 用の secrets
      - name: Set Edge Function secrets
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_SANDBOX_API_KEY: ${{ secrets.SANDBOX_API_KEY }}
          GH_SANDBOX_WEBHOOK_SECRET: ${{ secrets.SANDBOX_WEBHOOK_SECRET }}
          GH_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GH_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://any-pay.pages.dev' }}
        run: |
          existing="$(supabase secrets list 2>/dev/null || true)"
          set_secret() {
            # GitHub Secret があればそれを、無ければ未登録のときだけ乱数を生成して登録する
            name="$1"; value="$2"
            if [ -n "$value" ]; then
              supabase secrets set "$name=$value"
            elif ! printf '%s' "$existing" | grep -q "$name"; then
              supabase secrets set "$name=$(openssl rand -hex 32)"
            fi
          }
          set_secret SANDBOX_API_KEY "$GH_SANDBOX_API_KEY"
          set_secret SANDBOX_WEBHOOK_SECRET "$GH_SANDBOX_WEBHOOK_SECRET"
          supabase secrets set "APP_ORIGIN=$APP_ORIGIN"
          if [ -n "$GH_STRIPE_SECRET_KEY" ]; then
            supabase secrets set "STRIPE_SECRET_KEY=$GH_STRIPE_SECRET_KEY" "STRIPE_WEBHOOK_SECRET=$GH_STRIPE_WEBHOOK_SECRET"
          fi

      - name: Deploy Edge Functions (Charge Gateway / Sandbox)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          supabase functions deploy charge-methods
          supabase functions deploy charge-create
          supabase functions deploy charge-webhook --no-verify-jwt
          supabase functions deploy sandbox-gateway --no-verify-jwt

      # デプロイ確認：サンドボックスの公開エンドポイント（認証不要）が応答するか
      - name: Smoke test (sandbox-gateway)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/sandbox-gateway"
          body="$(curl -sS --max-time 30 "$url")"
          echo "$body"
          echo "$body" | grep -q '"Any Pay Sandbox Gateway"'

      # 生成した型を手書きの src/types/database.ts と突き合わせ、差分を artifact として残す
      - name: Generate types and diff
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: |
          supabase gen types typescript --linked --schema public > /tmp/database.generated.ts
          npx --yes prettier --parser typescript /tmp/database.generated.ts > /tmp/database.generated.pretty.ts || cp /tmp/database.generated.ts /tmp/database.generated.pretty.ts
          diff -u src/types/database.ts /tmp/database.generated.pretty.ts > /tmp/database.types.diff || true
          echo "型の差分行数: $(wc -l < /tmp/database.types.diff)"
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: database-types
          path: |
            /tmp/database.generated.ts
            /tmp/database.types.diff
          if-no-files-found: ignore

      # workflow_dispatch で commit_types=true のとき、生成した型をブランチにコミットする
      - name: Commit generated types
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.commit_types
        run: |
          cp /tmp/database.generated.ts src/types/database.ts
          if git diff --quiet -- src/types/database.ts; then
            echo "型に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git commit -m "chore(types): supabase gen types の出力で src/types/database.ts を更新"
          git push origin HEAD:${GITHUB_REF_NAME}
