# Supabase CLI 設定（`supabase init` 相当）。ローカル実行時は `supabase start`
project_id = "any-pay"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.sms]
enable_signup = true
enable_confirmations = true
# SMS プロバイダ契約なしでログインするためのテスト用 OTP（本番ダッシュボードでも同じ設定を行う）
[auth.sms.test_otp]
# キーは国番号付き・"+" なし（Supabase の保存形式）。seed.sql のユーザーと対応
"819000000001" = "123456"
"819000000002" = "123456"
"819000000003" = "123456"
"819000000011" = "123456"
"819000000012" = "123456"

[edge_runtime]
enabled = true
policy = "oneshot"
