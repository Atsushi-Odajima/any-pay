# Supabase CLI 設定。
# `supabase config push`（GitHub Actions）はここに書いた項目をそのままリモートへ上書きするため、
# 反映したい Auth 設定だけを最小限に書く（ポート等はデフォルトを使う）。
project_id = "any-pay"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "https://any-pay.pages.dev"
additional_redirect_urls = ["http://localhost:5173", "https://any-pay.pages.dev"]

# 電話番号 + OTP ログイン。SMS プロバイダ契約なしで動かすため Test OTP を使う
[auth.sms]
enable_signup = true
enable_confirmations = true

# キーは国番号付き・"+" なし（Supabase の保存形式）。seed.sql のユーザーと対応。認証コードはすべて 123456
[auth.sms.test_otp]
"819000000001" = "123456"
"819000000002" = "123456"
"819000000003" = "123456"
"819000000011" = "123456"
"819000000012" = "123456"
